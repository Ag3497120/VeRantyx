# XcodeGen spec for the Glovebox Mac installer (`brew install xcodegen && xcodegen`).
# This branch builds it as VeRantyx Standalone, an unofficial build based on Glovebox: the name the app shows is
# PRODUCT_DISPLAY_NAME below, and its identifiers are VeRantyx's, so it never replaces or updates as official Glovebox.
name: Glovebox
options:
  bundleIdPrefix: io.github.ag3497120.verantyx-standalone
  deploymentTarget:
    macOS: "15.0"
packages:
  GloveboxKit:
    path: ..
  SteamLauncherKit:
    path: ../../launcher
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.4
settings:
  base:
    MARKETING_VERSION: "0.1.5"
    CURRENT_PROJECT_VERSION: "1"
    # The app's name everywhere it shows (menu bar, Finder, the window, the app's own folders), kept in this one place.
    PRODUCT_DISPLAY_NAME: "VeRantyx Standalone"
    # Where Sparkle looks for new versions, and the public half of the EdDSA key that signs them
    # (scripts/release.sh). Updates stay off until the key is set.
    # VeRantyx Standalone: both empty, so Sparkle never starts (GloveboxApp.swift's Updater) and "Check for Updates…"
    # stays disabled. Upstream's feed and key were official Glovebox's: an update signed with that key would have
    # installed official Glovebox over this build, dropping the Joy-Con and hand-tracking input. There is no feed of
    # this build's own (it isn't distributed as a signed app); update it by building a newer checkout of this branch.
    GLOVEBOX_APPCAST_URL: ""
    GLOVEBOX_SPARKLE_KEY: ""
    # The Steam session's keychain item; empty is the "(dev)" one. release.sh sets the real name.
    GLOVEBOX_KEYCHAIN_SERVICE: ""
targets:
  Glovebox:
    type: application
    platform: macOS
    sources:
      - Glovebox
    dependencies:
      - package: GloveboxKit
        product: GloveboxKit
      - package: SteamLauncherKit
        product: SteamLauncherKit
      - package: Sparkle
        product: Sparkle
    info:
      path: Glovebox/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_DISPLAY_NAME)
        CFBundleName: $(PRODUCT_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Unofficial build based on Glovebox (MIT, the Glovebox contributors). Not affiliated with Glovebox, Valve or Apple."
        SUFeedURL: $(GLOVEBOX_APPCAST_URL)
        SUPublicEDKey: $(GLOVEBOX_SPARKLE_KEY)
        SUEnableAutomaticChecks: false
        # The keychain item for the Steam session: only release.sh sets it (empty: the "(dev)" one, SteamKeychain)
        GloveboxKeychainService: $(GLOVEBOX_KEYCHAIN_SERVICE)
        # Steam's content servers without HTTPS (its list for China has some) are fetched over HTTP, as Steam's own
        # client does. Each chunk is encrypted with the depot key and checked after decrypting (CDNClient).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: Glovebox/Glovebox.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ag3497120.verantyx-standalone.installer
        # The .app and its executable carry the display name, so it can't land on (or be mistaken for) an official
        # Glovebox.app in /Applications; the Swift module keeps upstream's name.
        PRODUCT_NAME: $(PRODUCT_DISPLAY_NAME)
        PRODUCT_MODULE_NAME: Glovebox
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        COMBINE_HIDPI_IMAGES: YES
        # The "Hello" glove logo, drawn on the macOS icon grid.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The engine-bundling script reads outside the target (the Glovebox source).
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postCompileScripts:
      - name: Bundle the engine
        basedOnDependencyAnalysis: false
        script: |
          # The engine is the Glovebox source (engine/glovebox.py and what it builds from), run with
          # Xcode's Python. GLOVEBOX_SRC is a glovebox-vr/glovebox checkout; GLOVEBOX_KIT_ZIP the
          # runtime kit the release names. Without a source, Debug builds bundle the fake engine so
          # the app runs end to end, and Release builds stop, so a release never ships without it.
          res="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          # The kit goes at the source root as glovebox-kit.zip, where the engine looks for it
          # (docs/INSTALLER.md, "Bundling"); the app copies the whole folder out before running it.
          rm -rf "$res/glovebox" "$res/engine" "$res/kit.zip"
          if [ -n "${GLOVEBOX_SRC:-}" ] && [ -f "$GLOVEBOX_SRC/engine/glovebox.py" ]; then
            mkdir -p "$res/glovebox"
            rsync -a --exclude .git --exclude build --exclude /src --exclude __pycache__ --exclude '.build' --exclude '*.xcodeproj' \
              "$GLOVEBOX_SRC/" "$res/glovebox/"
            if [ -n "${GLOVEBOX_KIT_ZIP:-}" ]; then cp "$GLOVEBOX_KIT_ZIP" "$res/glovebox/glovebox-kit.zip"; fi
          elif [ "$CONFIGURATION" = "Debug" ]; then
            mkdir -p "$res/engine" && cp "$SRCROOT/../FakeEngine/glovebox" "$res/engine/glovebox"
          else
            echo "error: no Glovebox source (set GLOVEBOX_SRC to a checkout of this branch)"; exit 1
          fi
          # Notarization needs every binary signed: sign the engine's with the app's identity.
          if [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ] && [ "$EXPANDED_CODE_SIGN_IDENTITY" != "-" ]; then
            find "$res/glovebox" "$res/engine" -type f -print0 2>/dev/null | while IFS= read -r -d '' f; do
              if file -b "$f" | grep -q Mach-O; then
                codesign --force --options runtime --timestamp --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$f"
              fi
            done
          fi
